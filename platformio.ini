; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:picow]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino

; Use the earlephilhower Arduino-Pico core (RP2040 dual-core, full SPI).
board_build.core = earlephilhower

; Serial monitor for diagnostics / node_print_stats().
monitor_speed = 115200

; -------------------------------------------------------------------------
; Dependencies
;   RadioLib   — SX1278 driver (non-blocking startTransmit/Receive/ChannelScan)
; -------------------------------------------------------------------------
lib_deps =
    jgromes/RadioLib @ ^7.1.0
    ; L4 flood application:
    ;   PubSubClient + ArduinoJson  -> base station (ROLE_SINK) MQTT bridge
    ;   TinyGPSPlus                 -> sensor (ROLE_SENDER) GPS
    ; Role-specific code is #if-guarded, so a given binary only links what it uses.
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.0
    mikalhart/TinyGPSPlus @ ^1.0.3

; -------------------------------------------------------------------------
; Build flags — header include path + compile-time node configuration.
; Override these per-node (NODE_ID / NODE_ROLE) at flash time or via a
; dedicated [env:...] section per device. See mesh_config.h for defaults.
; -------------------------------------------------------------------------
build_flags =
    -I include
    ; -D NODE_ID=0x0001        ; uncomment & set per node
    ; -D NODE_ROLE=ROLE_SINK   ; ROLE_SENDER | ROLE_RELAY | ROLE_SINK
    ; -D USE_CORE1_SENSOR=1     ; offload sensor sampling to core1
    ; --- Trim RadioLib to the SX127x family only (we use the SX1278). This
    ;     compiles all unused chip/protocol drivers to near-empty objects,
    ;     cutting build time, flash, and peak compiler memory. Do NOT exclude
    ;     SX127X. ---
    -D RADIOLIB_EXCLUDE_CC1101
    -D RADIOLIB_EXCLUDE_NRF24
    -D RADIOLIB_EXCLUDE_RF69
    -D RADIOLIB_EXCLUDE_SX1231
    -D RADIOLIB_EXCLUDE_SI443X
    -D RADIOLIB_EXCLUDE_RFM2X
    -D RADIOLIB_EXCLUDE_SX126X
    ; RADIOLIB_EXCLUDE_STM32WLX is set by BuildOpt.h on RP2040 already; omit to avoid redefinition warning
    -D RADIOLIB_EXCLUDE_SX128X
    -D RADIOLIB_EXCLUDE_AFSK
    -D RADIOLIB_EXCLUDE_AX25
    -D RADIOLIB_EXCLUDE_HELLSCHREIBER
    -D RADIOLIB_EXCLUDE_MORSE
    -D RADIOLIB_EXCLUDE_RTTY
    -D RADIOLIB_EXCLUDE_SSTV
    -D RADIOLIB_EXCLUDE_DIRECT_RECEIVE
    -D RADIOLIB_EXCLUDE_BELL
    -D RADIOLIB_EXCLUDE_APRS
    -D RADIOLIB_EXCLUDE_LORAWAN
    -D RADIOLIB_EXCLUDE_LR11X0
    -D RADIOLIB_EXCLUDE_FSK4
    -D RADIOLIB_EXCLUDE_PAGER

; =============================================================================
; Per-node build environments. Each physical board = same firmware with a
; different NODE_ID / NODE_ROLE. They inherit everything from [env:picow]
; (note the ${env:picow.build_flags} reference -- without it a child's
; build_flags REPLACES the parent's instead of extending it).
;
;   Flash:   pio run -e node_sender -t upload
;   Monitor: pio device monitor -b 115200
; =============================================================================
[env:node_sender]
extends = env:picow
build_flags =
    ${env:picow.build_flags}
    -D NODE_ID=0x0001
    -D NODE_ROLE=ROLE_SENDER
    -D NODE_SINK_ADDR=0x00FF

[env:node_relay]
extends = env:picow
build_flags =
    ${env:picow.build_flags}
    -D NODE_ID=0x0002
    -D NODE_ROLE=ROLE_RELAY
    -D NODE_SINK_ADDR=0x00FF

[env:node_sink]
extends = env:picow
build_flags =
    ${env:picow.build_flags}
    -D NODE_ID=0x00FF
    -D NODE_ROLE=ROLE_SINK
    -D NODE_SINK_ADDR=0x00FF